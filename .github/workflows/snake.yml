name: Generate Snake

on:
  # 每天 UTC 0 点（北京时间 8 点）生成一次公开 SVG。
  schedule:
    - cron: "0 0 * * *" 
  
  # 允许在 Actions 页面手动触发，方便首次生成和检查。
  workflow_dispatch:

# 生成结果需要推送到 output 分支，因此只授予仓库内容写入权限。
permissions: 
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 使用同一个只读令牌读取完整贡献日历，使私有贡献以匿名格子的形式计入。
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: Colin0v0
          github_token: ${{ secrets.CONTRIBUTION_TOKEN }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 将所有公开展示的 SVG 推送到 output 分支。
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
